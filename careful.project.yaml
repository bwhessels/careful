version: 1
project:
  name: careful
  maturity: self-hosting

commands:
  validate_change_dependencies: python3 scripts/validate_change_dependencies.py
  validate_spec_authority: python3 scripts/validate_spec_authority.py
  validate_public_readiness: python3 scripts/validate_public_readiness.py
  validate_self_hosting: python3 scripts/validate_self_hosting.py
  validate_specs: openspec validate --specs
  validate_evidence_ledger: python3 scripts/validate_evidence_ledger.py
  analyze_change_impact: python3 scripts/analyze_change_impact.py
  assess_careful: python3 scripts/assess_careful.py
  review_codebase_hygiene: python3 scripts/review_codebase_hygiene.py

risk_boundaries:
  - adapter_contract
  - workflow_schema
  - evidence_policy
  - documentation_model

documentation:
  readme: README.md
  specs: openspec/specs/
  changes: openspec/changes/
  architecture: docs/design.md
  development: AGENTS.md
  spec_authority: openspec
  execution_plans: docs/superpowers/plans/

public_readiness:
  audience: public-intended
  required_documents:
    - README.md
    - LICENSE
  checks:
    - python3 -m unittest discover -s tests -v
    - python3 scripts/validate_change_dependencies.py
    - python3 scripts/validate_spec_authority.py
    - python3 scripts/validate_public_readiness.py
    - python3 scripts/validate_self_hosting.py
    - openspec validate --all --strict --no-interactive
  gates:
    first_publication: maintainer-review
    release: maintainer-review

assessment:
  ledger: evidence/ledger.json
  fail_on_unknown: false
  required_surfaces:
    - durable-specification
    - public-documentation
  mappings:
    - pattern: plugins/careful/
      surface: codex-adapter
      required: true
    - pattern: adapters/
      surface: cross-harness-adapters
      required: true

self_hosting:
  distributable_adapters:
    - plugins/careful/
    - adapters/claude-code/
    - adapters/factory-droid/
  private_context: .careful/
  fixture_projects:
    - fixtures/adopted-project/codex/
    - fixtures/adopted-project/claude-code/
    - fixtures/adopted-project/factory-droid/
  require_fresh_session_after_adapter_update: true
