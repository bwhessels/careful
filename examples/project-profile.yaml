version: 1
project:
  name: example-service
  maturity: adopted

commands:
  test: npm test
  lint: npm run lint
  typecheck: npm run typecheck

risk_boundaries:
  - public_api
  - database_migration
  - authentication

documentation:
  readme: README.md
  specs: openspec/specs/
  changes: openspec/changes/
  architecture: docs/architecture/
  decisions: docs/architecture/decisions/
  development: docs/development/
  reference: docs/reference/
  spec_authority: openspec
  execution_plans: docs/superpowers/plans/

public_readiness:
  audience: internal
  required_documents:
    - README.md
  checks:
    - npm test
  gates:
    first_publication: independent-review
    release: independent-review

assessment:
  ledger: evidence/ledger.json
  fail_on_unknown: false
  required_surfaces:
    - durable-specification
    - public-documentation
  mappings:
    - pattern: src/api/
      surface: public-api
      required: true

careful:
  adapters:
    - codex
    - claude-code
    - factory-droid
  private_context: .careful/
